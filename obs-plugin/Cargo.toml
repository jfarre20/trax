[package]
name = "trax-obs"
version = "0.1.0"
edition = "2021"
description = "TRAX now-playing overlay as a native OBS source (Windows)"
license = "GPL-2.0-or-later"

[lib]
name = "trax"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
base64 = "0.22"
sha1 = "0.10"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
]

# Only `examples/publish.rs` needs to create a window and publish a media
# session, so those features stay out of the shipped plugin's build.
[dev-dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    # RegisterClassW and WNDCLASSW are gated behind the GDI feature.
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 2
debug = 1
